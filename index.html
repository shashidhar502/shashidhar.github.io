<!DOCTYPE html>
<html>
<body>

<h2>Using the XMLHttpRequest Object</h2>

<p id="demo"></p>
<a href="microsoft-edge:https://www.example.com">Open in Edge</a>
<select id="agentDelay" style="padding:4px 6px; font-size:14px;">
  <option value="3000">3 seconds</option>
  <option value="5000">5 seconds</option>
  <option value="10000">10 seconds</option>
  <option value="20000">20 seconds</option>
</select>
<button type="button" onclick="loadasync()">Agent app async</button>
<button type="button" onclick="loadsync()">Agent app sync</button>
<button type="button" onclick="loadTest()"> Test Agent app full url</button>
</div>

<div style=margin-top:20px;>
<select id="requestorDelay" style="padding:4px 6px; font-size:14px;">
  <option value="3000">3 seconds</option>
  <option value="5000">5 seconds</option>
  <option value="10000">10 seconds</option>
  <option value="20000">20 seconds</option>
</select>
<button type="button" onclick="loadRequestasync()">Requestor app async</button>
<button type="button" onclick="loadRequestsync()">Requestor app sync</button>
</div>

<div style="margin-top:20px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
  <input
    type="text"
    id="snHostInput"
    placeholder="service-now.com"
    style="padding:6px 10px; font-size:14px; width:280px; border:1px solid #ccc; border-radius:4px;"
  />
  <select id="snappSelect" style="padding:6px 8px; font-size:14px; border:1px solid #ccc; border-radius:4px;" onchange="toggleCustomSchema()">
    <option value="agent">agent</option>
    <option value="mobile">mobile</option>
    <option value="custom">custom schema…</option>
  </select>
  <input
    type="text"
    id="customSchemaInput"
    placeholder="enter custom schema"
    style="display:none; padding:6px 10px; font-size:14px; width:180px; border:1px solid #ccc; border-radius:4px;"
  />
  <select id="mobileAppDelay" style="padding:6px 8px; font-size:14px; border:1px solid #ccc; border-radius:4px;">
    <option value="3000">3 seconds</option>
    <option value="5000">5 seconds</option>
    <option value="10000">10 seconds</option>
    <option value="20000">20 seconds</option>
  </select>
  <button type="button" onclick="goToMobileAppLink()" style="padding:6px 14px; font-size:14px; cursor:pointer;">
    Go to mobileapplink (sync)
  </button>
  <button type="button" onclick="goToMobileAppLinkAsync()" style="padding:6px 14px; font-size:14px; cursor:pointer;">
    Go to mobileapplink (async)
  </button>
  <span id="snLinkError" style="color:red; font-size:13px;"></span>
</div>

<script>
function toggleCustomSchema() {
  var sel = document.getElementById("snappSelect");
  var custom = document.getElementById("customSchemaInput");
  custom.style.display = sel.value === "custom" ? "inline-block" : "none";
}

function buildMobileAppUrl() {
  var raw = document.getElementById("snHostInput").value.trim();
  var error = document.getElementById("snLinkError");
  error.textContent = "";

  var host = raw;
  host = host.replace(/^https?:\/\//i, "");
  host = host.split("/")[0];

  var sel = document.getElementById("snappSelect");
  var snapp;
  if (sel.value === "custom") {
    snapp = document.getElementById("customSchemaInput").value.trim();
    if (!snapp) {
      error.textContent = "Please enter a custom schema value.";
      return null;
    }
  } else {
    snapp = sel.value;
  }

  var url;
  if (!host || host.toLowerCase() === "service-now.com") {
    url = "https://service-now.com/mobileapplink?snapp=" + encodeURIComponent(snapp) + "&params=blah";
  } else {
    var subdomain = host;
    if (host.toLowerCase().endsWith(".service-now.com")) {
      subdomain = host.slice(0, host.length - ".service-now.com".length);
    }
    url = "https://" + subdomain + ".service-now.com/mobileapplink?snapp=" + encodeURIComponent(snapp) + "&params=blah";
  }
  return "https://httpbin.org/redirect-to?url=" + encodeURIComponent(url);
}

function goToMobileAppLink() {
  var url = buildMobileAppUrl();
  if (url) window.location.href = url;
}

function goToMobileAppLinkAsync() {
  var url = buildMobileAppUrl();
  if (!url) return;
  var delay = parseInt(document.getElementById("mobileAppDelay").value);
  document.getElementById("demo").innerHTML = "loading async...";
  setTimeout(function() {
    document.getElementById("demo").innerHTML = "loading async triggered...";
    window.location.href = url;
  }, delay);
}
</script>
